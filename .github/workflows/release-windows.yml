name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            electron/package-lock.json

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install electron dependencies
        run: npm ci --prefix electron

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Publish backend for Windows
        run: dotnet publish backend/Checklist.Api.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o backend/publish-win

      - name: Set Electron app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --prefix electron --no-git-tag-version ${{ github.ref_name }}

      - name: Build Electron installer
        run: npm run build --prefix electron

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml
